<svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Product placeholder</title>
  <desc id="desc">Abstract gradient background used as a placeholder for product visuals.</desc>
  <defs>
